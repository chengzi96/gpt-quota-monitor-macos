name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Verify deployment target
        run: |
          set -euo pipefail
          APP="dist/GPT流量监控.app"
          APP_BIN="$APP/Contents/MacOS/AIQuotaBar"
          CODEX_BIN="$APP/Contents/Resources/codex-app-server"

          echo "=== GPT流量监控 ==="
          xcrun vtool -show-build "$APP_BIN"
          echo "=== Codex App Server ==="
          xcrun vtool -show-build "$CODEX_BIN"

          app_minos="$(xcrun vtool -show-build "$APP_BIN" | awk '/minos/{print $2; exit}')"
          codex_minos="$(xcrun vtool -show-build "$CODEX_BIN" | awk '/minos/{print $2; exit}')"

          echo "App minOS: $app_minos"
          echo "Codex minOS: $codex_minos"

          app_major="${app_minos%%.*}"
          codex_major="${codex_minos%%.*}"

          if [[ -z "$app_major" || "$app_major" -gt 13 ]]; then
            echo "App deployment target is higher than macOS 13" >&2
            exit 1
          fi
          if [[ -z "$codex_major" || "$codex_major" -gt 13 ]]; then
            echo "Bundled Codex App Server requires newer than macOS 13" >&2
            exit 1
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPT流量监控-v0.3.28-macOS13+
          path: dist/GPT流量监控-0.3.28-macOS13+.zip
          if-no-files-found: error

  smoke-macos14:
    name: Smoke test fallback UI on macOS 14
    needs: build
    runs-on: macos-14
    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: GPT流量监控-v0.3.28-macOS13+
          path: dist

      - name: Verify and launch
        run: |
          set -euo pipefail
          ditto -x -k "dist/GPT流量监控-0.3.28-macOS13+.zip" dist/unpacked
          APP="dist/unpacked/GPT流量监控.app"
          BIN="$APP/Contents/MacOS/AIQuotaBar"
          codesign --verify --deep --strict "$APP"

          "$BIN" >/tmp/gpt-flow-monitor.stdout 2>/tmp/gpt-flow-monitor.stderr &
          pid=$!
          sleep 6

          if kill -0 "$pid" >/dev/null 2>&1; then
            echo "GPT流量监控 is alive on macOS 14 (pid=$pid)"
            kill "$pid" || true
            wait "$pid" || true
          else
            status=0
            wait "$pid" || status=$?
            echo "GPT流量监控 exited early on macOS 14 (status=$status)" >&2
            echo "=== stdout ==="
            cat /tmp/gpt-flow-monitor.stdout || true
            echo "=== stderr ==="
            cat /tmp/gpt-flow-monitor.stderr || true
            echo "=== DiagnosticReports ==="
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
              \( -name 'AIQuotaBar*.ips' -o -name 'AIQuotaBar*.crash' -o -name 'GPT流量监控*.ips' \) \
              -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, smoke-macos14]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: GPT流量监控-v0.3.28-macOS13+
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.3.28"
          ASSET="dist/GPT流量监控-0.3.28-macOS13+.zip"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GPT流量监控 v0.3.28" \
              --prerelease \
              --notes $'兼容性更新：\n\n- 运行最低版本降至 macOS 13\n- macOS 26+ 保持原生 Liquid Glass\n- macOS 13–15 自动使用系统 Material 毛玻璃\n- Apple Silicon\n- 修复版继续保留 v0.3.27 的 MainActor 稳定性修复\n\n当前为 Public Preview，App 使用 ad-hoc 签名，尚未进行 Apple Developer ID 公证。'
          fi
